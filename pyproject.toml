[project]
name = "clinotes"
version = "0.1.0"
description = "Simple CLI Notes App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "prompt-toolkit>=3.0.52",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]

[tool.ruff.lint]
ignore = ["EXE002"]
extend-select = ["I", "B", "UP", "SIM", "C4", "G", "DTZ"]

[mypy]
strict = true
explicit_package_bases = true