[project]
name = "clinotes"
version = "0.1.0"
description = "Simple CLI Notes App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "prompt-toolkit>=3.0.52",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.16.5"
]

[tool.ruff.lint]
extend-select = ["YTT", "ASYNC", "S", "BLE", "B", "C4", "DTZ", "T10", "EXE", "FA", "INT", "ISC", "LOG", "G", "PIE", "PYI", "PT", "RET", "SIM", "TC", "PTH", "FLY", "I", "N", "PERF", "E", "W", "D", "F", "PGH", "PL", "UP", "FURB", "RUF", "TRY"]

[tool.mypy]
strict = true
explicit_package_bases = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
clinotes = "app.cli:main"