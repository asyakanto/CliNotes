[project]
name = "clinotes"
version = "0.1.0"
description = "Simple CLI Notes App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "prompt-toolkit>=3.0.52",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.16.5"
]

[tool.ruff.lint]
ignore = ["EXE002"]
extend-select = ["I", "B", "UP", "SIM", "C4", "G", "DTZ"]

[tool.mypy]
strict = true
explicit_package_bases = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
clinotes = "app.cli:main"